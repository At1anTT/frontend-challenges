<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the number</title>
    <link rel="stylesheet" href="./style.css" />
    <script scr="./script.js" type="module"></script>
  </head>
  <body>
    <div class="container">
      <form class="form-container" action="">
        <span id="header-text">
          I'm thinking of a number between 0 and 100. Can you guess it? <br> You have
          10 guesses remaining.
        </span>
        <label for="number-input">Your guess(0-100):</label>
        <input placeholder="Enter a number" name="number-input" type="text" />
        <span>Enter a number between 0 and 100</span>
        <div class="">
          <button type="submit">Submit Guess</button>
          <button type="reset">New Game</button>
        </div>
        <div class="guesses-field"></div>
      </form>
    </div>
  </body>
</html>
