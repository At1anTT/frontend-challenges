<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My telephone formatter</title>
    <link rel="stylesheet" href="dropStyle.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" type="module"></script>
  </head>
  <body>
    <header>Telephone formatter</header>

    <div class="container">
      <form action="">
        <h1 class="form-title">Phone number</h1>
        <input type="text" placeholder="+(123) 456-7890" />
        <p>Enter a 10-digit phone number. Format: +(123) 456-7890</p>
      </form>
    </div>
  </body>
</html>
