<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My telephone formatter</title>
    <link rel="stylesheet" href="dropStyle.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" type="module"></script>
  </head>
  <body>
    <header>Telephone formatter</header>

    <main>
      <!-- <h1 class="sr-only">Phone Number Formatter</h1> -->
      <div class="container">
        <form action="">
          <label for="phone" class="form-title">Phone number</label>
          <div class="input-wrapper">
            <input
              id="phone"
              name="phone"
              type="tel"
              placeholder="+(123) 456-7890"
              inputmode="tel"
              autocomplete="off"
              maxlength="16"
              aria-describedby="phone-format"
              aria-invalid="false"
              required
              autofocus
            />
            <span class="input-image">&#128222;</span>
          </div>
          <p id="phone-format">
            Enter a 10-digit phone number. Format: +(123) 456-7890
          </p>
          <p
            id="phone-error"
            class="error-message"
            role="alert"
            aria-live="polite"
          ></p>
        </form>
      </div>
    </main>
  </body>
</html>
