<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String transformers</title>
    <link rel="stylesheet" href="./dropStyle.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <script src="./script.js" type="module"></script>
  </head>
  <body>
    <main class="text-center">
      <h1 class="sr-only">String transformers</h1>
    </main>

    <div class="container">
      <div class="input-form">
        <input
          id="input-user-text"
          type="text"
          placeholder="this is a normal sentence to transform"
        />
        <small id="small-text"
          >Type any text to see it transformed in different formats below</small
        >
      </div>
      <div class="transformers">
        <div class="transformer-item" tabindex="0">
          <span class="tranformer-label">Lower Case</span>
          <output id="transformer-to-lowercase-text" class="transformer-output">
          </output>
        </div>
        <div class="transformer-item" tabindex="0">
          <span class="tranformer-label">Upper Case</span>
          <output id="transformer-to-uppercase-text" class="transformer-output">
          </output>
        </div>
        <div class="transformer-item" tabindex="0">
          <span class="tranformer-label">Camel Case</span>
          <output id="transformer-to-camelcase-text" class="transformer-output">
          </output>
        </div>
        <div class="transformer-item" tabindex="0">
          <span class="tranformer-label">Pascal Case</span>
          <output
            id="transformer-to-pascalcase-text"
            class="transformer-output"
          >
          </output>
        </div>
        <div class="transformer-item" tabindex="0">
          <span class="tranformer-label">Snake Case</span>
          <output id="transformer-to-snakecase-text" class="transformer-output">
          </output>
        </div>
        <div class="transformer-item" tabindex="0">
          <span class="tranformer-label">Kebab Case</span>
          <output id="transformer-to-kebabcase-text" class="transformer-output">
          </output>
        </div>
        <div class="transformer-item" tabindex="0">
          <span class="tranformer-label">Trim Spaces</span>
          <output id="transformer-to-trimcase-text" class="transformer-output">
          </output>
        </div>
      </div>
    </div>
  </body>
</html>
