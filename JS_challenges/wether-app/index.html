<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./dropStyle.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="./script.js" type="module"></script>
  </head>
  <body>
    <main class="container">
      <form class="application-form">
        <h1 class="form-label">check the weather!!</h1>
        <div class="input-wrapper">
          <input
            type="text"
            placeholder="Enter city name"
            name="user-input-city"
            required
            aria-label="City name"
          />
          <button
            class="search-btn"
            type="submit"
            aria-label="Search city"
          ></button>
        </div>
        <div class="error" hidden><p>INVALID CITY NAME!!!</p></div>
        <div class="weather" hidden>
          <img
            id="wether-indicator"
            src="./images/snow.png"
            alt="weather-img"
          />
          <h2 id="temperature-value">7</h2>
          <h3 id="city-name">Moscow</h3>
          <div class="additional-indicators">
            <div class="additional-indicator">
              <img
                class="additional-indicator-icons"
                src="./images/haze.png"
                alt="pressure-icons"
              />
              <div class="additional-indicator-text-descr">
                <p class="digital-value-indicator" id="pressure-value">73%</p>
                <p class="additional-indicator-name">Humidity</p>
              </div>
            </div>
            <div class="additional-indicator">
              <img
                class="additional-indicator-icons"
                src="./images/wind.png"
                alt="wind-icons"
              />
              <div class="additional-indicator-text-descr">
                <p class="digital-value-indicator" id="wind-value">24km/h</p>
                <p class="additional-indicator-name">Wind Speed</p>
              </div>
            </div>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
