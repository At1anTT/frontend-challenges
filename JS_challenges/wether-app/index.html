<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./dropStyle.css" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" type="typemodule"></script>
  </head>
  <body>
    <main class="container">
      <div class="application-form">
        <h1 class="form-label">check the weather!!</h1>
        <form class="input-wrapper">
          <input
            type="text"
            placeholder="Enter city name"
            name="user-input-city"
          />
          <button class="search-btn"></button>
        </form>
        <div class="error"><p>INVALID CITY NAME!!!</p></div>
        <div class="weather">
          <img
            id="wether-indicator"
            src="./images/snow.png"
            alt="weather-img"
          />
          <p id="temperature-value">7</p>
          <p id="city-name">Moscow</p>
          <div class="additional-indicators">
            <div class="additional-indicator">
              <p id="pressure-value">73%</p>
              <img
                class="additional-indicator-icons"
                src="./images/haze.png"
                alt="pressure-icons"
              />
              <p class="additional-indicator-name">Humidity</p>
            </div>
            <div class="additional-indicator">
              <p id="wind-value">24km/h</p>
              <img
                class="additional-indicator-icons"
                src="./images/wind.png"
                alt="wind-icons"
              />
              <p class="additional-indicator-name">Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
