<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" type="module"></script>
    <title>Document</title>
  </head>
  <body>
    <main>
      <form class="password-checker" name="password-checker">
        <input
          id="password-input"
          type="text"
          placeholder="Enter the password"
          autocomplete="off"
        />
        <div class="criteries-security">
          <div class="criteries-stilization" id="lowercase-indicator">
            Lowercase
          </div>
          <div class="criteries-stilization" id="uppercase-indicator">
            Uppercase
          </div>
          <div class="criteries-stilization" id="number-indicator">Number</div>
          <div class="criteries-stilization" id="symbol-indicator">Symbols</div>
        </div>
        <div id="progress-bar-wrapper">
          <div id="progress-bar-fill"></div>
        </div>
        <div id="password-length-value">Password</div>
        <div id="security-level-text">Weak</div>
      </form>
    </main>
  </body>
</html>
